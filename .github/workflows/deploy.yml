# Выкладка сайта на хостинг Reg.ru после каждого push в main.
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD — из панели Reg.ru (раздел FTP);
#   FTP_DIR (необязательно) — папка сайта на сервере, по умолчанию www/arkhfilm.ru/
name: Deploy to Reg.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Секреты ещё не заданы — пропускаем
        if: env.FTP_SERVER == ''
        run: echo "Добавьте FTP_SERVER, FTP_USERNAME и FTP_PASSWORD в секреты репозитория."

      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''

      - name: Загрузка по FTP (только изменённые файлы)
        id: ftp1
        if: env.FTP_SERVER != ''
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          server-dir: ${{ secrets.FTP_DIR || 'www/arkhfilm.ru/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            tools/**
            logo/**
            CNAME
            **/.DS_Store

      - name: Повторная попытка, если сервер не ответил
        if: env.FTP_SERVER != '' && steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          server-dir: ${{ secrets.FTP_DIR || 'www/arkhfilm.ru/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            tools/**
            logo/**
            CNAME
            **/.DS_Store
